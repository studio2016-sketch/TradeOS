name: TradeOS safety checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/week-one-guided-trading]
permissions:
  contents: read
jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
