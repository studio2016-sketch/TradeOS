name: TradeOS safety checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/week-one-guided-trading]
permissions:
  contents: read
jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx --yes tsx --test tests/*.test.ts
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.CI_NEON_AUTH_COOKIE_SECRET }}
          NEON_AUTH_BASE_URL: ${{ vars.CI_NEON_AUTH_BASE_URL }}
