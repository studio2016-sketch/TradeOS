name: Private graph assertion audit
on:
  workflow_dispatch:
  schedule:
    - cron: "25 16 * * 1-5"
permissions:
  contents: read
  id-token: write
jobs:
  assertions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check scoped assertions without logging private evidence
        run: python3 scripts/run-private-oidc-audit.py graph
