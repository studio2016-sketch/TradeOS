name: TradeOS Storage Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  storage-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci
      - run: npm test
