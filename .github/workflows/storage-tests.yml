name: TradeOS Storage Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  storage-validation:
    runs-on: ubuntu-latest
    env:
      NEON_AUTH_BASE_URL: https://ci.invalid
      NEON_AUTH_COOKIE_SECRET: ci-build-only-cookie-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci
      - run: npm test
      - name: Verify production build
        run: npm run build
