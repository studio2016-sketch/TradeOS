name: Private market readiness audit
on:
  workflow_dispatch:
  schedule:
    - cron: "5 13 * * 1-5"
permissions:
  contents: read
  id-token: write
jobs:
  assertions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check scoped provider-clock and observation assertions
        run: python3 scripts/run-private-oidc-audit.py readiness
